<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Travels - Packages</title>
    <style>
        .sticky-top-block { position: sticky; top: 0; z-index: 2000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: lightgrey; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #006699; color: white; text-align: center; padding: 2.5rem 1rem;position: sticky;top: 0;z-index: 1000; }
        header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px;color: yellow; }
        header p { margin: 0.5rem 0 0 0; font-style: italic; font-size: 1.2rem; color: #e0f2fe; }
        nav { background-color: #004d73; display: flex; justify-content: center; gap: 20px; padding: 10px;position: sticky;top: 0;z-index: 1000; }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 8px 16px; border-radius: 4px; }
        nav a:hover, nav a.active { background-color: #00334d; }
        .main-content { flex: 1; }
        .grid { max-width: 1200px; margin: 30px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 0 20px; justify-content: center; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #e2e8f0; }
        .card-content { padding: 15px; }
        .card-title { font-size: 1.3rem; margin: 0 0 10px 0; color: #006699; }
        .card-desc { font-size: 0.95rem; color: #555; margin-bottom: 15px; }
        .card-price { font-size: 1.2rem; font-weight: bold; color: #e11d48; }
        footer { background-color: #1e293b; color: #f1f5f9; text-align: center; padding: 25px 15px; margin-top: 40px; font-size: 0.95rem; border-top: 4px solid #006699; }
        footer p { margin: 6px 0; }
        footer a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="sticky-top-block">
    <header>
        <h1>Artomoro Tour&Travels</h1>
        <p>"Your Travels Solution"</p>
     </header>

    <nav>
        <a href="index.html">About Us</a>
        <a href="index1.html" class="active">Travel Packages</a>
        <a href="index2.html">Gallery</a>
    </nav>
   
</div>
    <div class="main-content">
        <div class="grid" id="packages-container">
            <!-- Live Google Sheet Data Inserts Here -->
        </div>
    </div>

    <footer>
        <p><strong>Travels Agency</strong></p>
        <p>📍 Address: Jln Raya Cerme Lor No 03 Gresik Jawa Timur 6117</p>
        <p>💬 Contact Us via WhatsApp: <a href="https://wa.me" target="_blank">6285859994640</a>:Sari</p>
        <p style="margin-top: 15px; font-size: 0.85rem; color: #94a3b8;">&copy; 2026 Wanderlust Travels. All rights reserved.</p>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytEtGBmxTUr3d0MFTeSP6eKbiBWfCajUF8OwF3AvMb_iyfc9p_JGdBg8ncEAAW9QR1/exec";

        async function fetchPackages() {
            try {
                const response = await fetch(`${SCRIPT_URL}?type=packages`);
                const packages = await response.json();
                const container = document.getElementById('packages-container');
                
                if(packages.length === 0) {
                    container.innerHTML = "<p>No packages currently available.</p>";
                    return;
                }

                container.innerHTML = packages.map(pkg => `
                    <div class="card">
                        <img src="${pkg.image}" alt="${pkg.title}">
                        <div class="card-content">
                            <h3 class="card-title">${pkg.title}</h3>
                            <p class="card-desc">${pkg.description}</p>
                            <div class="card-price">${pkg.price}</div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error loading packages:", error);
                document.getElementById('packages-container').innerHTML = "<p>Failed to load packages. Please check back later.</p>";
            }
        }
        fetchPackages();
    </script>
</body>
</html>
